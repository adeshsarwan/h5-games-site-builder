name: Sync Google Play data
on:
  schedule:
    - cron: "17 1 * * *" # daily, 06:47 IST
  workflow_dispatch:
    inputs:
      site:
        description: "Site key (folder in content/)"
        default: torunex-site
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save google-play-scraper@10
      - run: node scripts/sync-play.mjs "${{ inputs.site || 'torunex-site' }}"
      - name: Commit
        run: |
          git config user.name "play-sync"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Sync Google Play data for ${{ inputs.site || 'torunex-site' }}"
          git push
