name: Import site content
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site key (folder in sites/ and content/)"
        default: torunex-site
      source:
        description: "Source site to import from"
        default: https://gamezadda.store
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save linkedom@0.18
      - run: node scripts/import-gamezadda.mjs "${{ inputs.site }}" "${{ inputs.source }}"
      - name: Commit
        run: |
          git config user.name "content-import"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "Import content for ${{ inputs.site }} from ${{ inputs.source }}"
          git push
